image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbla1 {
		image = "%ATFBIN%"
		size = 256k
	}

	partition fsbla2 {
		image = "%ATFBIN%"
		size = 256k
	}

	partition metadata1 {
		image = "mdata.bin"
		partition-type-uuid = "%FWUMDATA_UUID%"
	}

	partition metadata2 {
		image = "mdata.bin"
		partition-type-uuid = "%FWUMDATA_UUID%"
	}

	partition fip-a {
		image = "fip.bin"
		partition-uuid = "%FIPA_UUID%"
		partition-type-uuid = "%FIP_UUID_TYPE%"
		size = 4M
	}

	partition fip-b {
		partition-uuid = "%FIPB_UUID%"
		partition-type-uuid = "%FIP_UUID_TYPE%"
		size = 4M
	}

	partition u-boot-env {
		image = "uboot-env.bin"
		# Twice the environment size to allow redundancy
		size = 0x4000
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		size = 200M
	}

	partition rootfs-b {
		size = 200M
	}

	partition data {
		image = "data.ext4"
	}
}

image data.ext4 {
	name = "data"
	ext4 {
		label = "data"
	}
	size = 200M
}

flash nor-64M {
        pebsize = 64K
        numpebs = 1024
        minimum-io-unit-size = 1
}

image nor.img {
	flash {
	}
	flashtype = "nor-64M"

	partition fsbla1 {
		image = "%ATFBIN%"
		size = 256K
	}

	partition fsbla2 {
		image = "%ATFBIN%"
		size = 256K
	}

	partition metadata1 {
		image = "mdata-nor.bin"
		size = 256K
	}

	partition metadata2 {
		image = "mdata-nor.bin"
		size = 256K
	}

	partition fip-a {
		image = "fip.bin"
		size = 4M
	}

	partition fip-b {
		size = 4M
	}

	partition u-boot-env {
		image = "uboot-env.bin"
		# Matches CONFIG_ENV_OFFSET in U-Boot
		offset = 0x900000
		# PEB size
		size = 64k
	}

	partition u-boot-env-red {
		image = "uboot-env.bin"
		# Matches CONFIG_ENV_OFFSET_REDUND in U-Boot
		offset = 0x940000
		# PEB size
		size = 64k
	}
}

# EMMC rootfs images
image emmc.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		bootable = "yes"
		size = 200M
	}

	partition rootfs-b {
		bootable = "yes"
		size = 200M
	}

	partition data {
		image = "data.ext4"
	}
}
